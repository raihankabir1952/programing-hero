<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Practice</title>
  <style>
    .green {
      color: green;
    }
  </style>
</head>

<body>


  <h1 id="title">Hello World</h1>

  <p></p>
  <h2 class="query"></h2>

  <h3 class="text"></h3>
  <h3 class="text"></h3>
  <h3 class="text"></h3>

  <p>click here to show date</p>
  <p id="demo"></p>
  <button onclick="displayDate()">click me</button>
  <!-- onclick Not Recommended -->
  <!-- addEventListener -->

  <p>click here to show date using addEventListener</p>
  <p id="demo2"></p>
  <button id="mybtn" style="color: green;">What time it ? </button>

  <p id="demo3"></p>
  <button id="mybtn2" style="color: red;">mouseover</button>

  <p id="test">Change the text</p>

  <h1 id="bold"></h1>

  <h6 id="class">Hello</h6>

  <!-- classList.toggle() -->
  <h4 id="title100">Hello Bangladesh</h4>
  <button id="btn100" style="color: goldenrod;">Toggle color</button><br><br>

  <!--image change-->
  <img id="img"
    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ62mZn-g_FDVhNAYwqwPoESQG3SPPdwb3tqGphpeBmbQ&s=10" alt=""
    height="100px"><br>
  <button id="img-btn">Click here to change image</button><br>
  <hr>

  <!--BOM location-->
  <button id="bom">Location change</button> <br><br>

  <!-- history -->
  <button id="back">Back</button>
  <button id="forword">Forword</button>

  <!-- timer -->
  <p id="count" style="color: red; font-weight: bold;" >0</p>

  <button id="start">Start</button>
  <button id="stop">Stop</button>

  <!--local storage-->
<h2 id="username"></h2>

<button id="save">Save Name</button>
<button id="show">Show Name</button>

  <script src="app.js"></script>
