<!-- ১. পুরো পেজের জন্য একটি মূল কন্টেইনার বা ফাদার বক্স -->
<head>
<link rel="stylesheet" href="style.css">
</head>

<div class="hole-page">
    
    <!-- ২. বাম পাশের সেকশন (লাল-বেগুনী গ্রেডিয়েন্ট অংশ) -->
    <div class="left-side">
        <h1>Hello! Friends</h1>
        <p>To keep connected with us please<br>create your Account with your<br>personal info</p>
        <button>Sign In</button>
    </div>

    <!-- ৩. ডান পাশের সেকশন (সাদা ফর্ম অংশ) -->
    <div class="right-side">
        <h1>Create Account</h1>
        
        <!-- ৪. সোশ্যাল আইকনগুলোকে পাশাপাশি রাখার জন্য একটি ছোট বক্স -->
        <div class="social-icons">
            <img src="./icons/facebook.png" alt="facebook">
            <img src="./icons/insta.png" alt="instagram">
            <img src="./icons/twitter.png" alt="twitter">
        </div>
        
        <p>or use your email for registration:</p>
        
        <!-- ৫. ইউজার ইনপুট ফিল্ড সমূহ -->
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <input type="password" placeholder="Password">
        
        <!-- ৬. মেইন সাইন আপ বাটন -->
        <button>Sign Up</button>
    </div>

</div>
