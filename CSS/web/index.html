<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: yellow;
            height: 70px;
        }

        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('wallpaper.jpg');
            background-size: cover;
            background-position: center;
            height: 200px;
            color: white;
        }

        .navbar {
            display: flex;
            justify-content: left;
            gap: 15px;
            color: rgba(30, 28, 28, 0.495);
            background-color: rgb(39, 38, 38);
            height: 50px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 20px;
            padding: 15px;


        }

        a:hover
        {
            background-color: blueviolet;
        }
    </style>
</head>

<body>
    <header>
        <div class="header">
            <h2>Resize the browser window to see the responsive effect</h2>

        </div>
    </header>
    <div class="banner">
        <h1>My Website</h1>
        <p>with a flexiable website</p>
    </div>
<div>
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">Home</a>
        <a href="#">Home</a>
        <a href=""></a>
    </nav>
    </div>

</body>

</html>
